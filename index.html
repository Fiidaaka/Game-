
<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <!-- 1. Adsgram SDK HTML keessatti fe'uuf -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            margin-top: 20px;
            width: 100%;
            max-width: 300px;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Fiidaaka Tapha Mini App</h2>
        <p id="status-text">Adsgram SDK eegaa jira...</p>
        
        <!-- Button Beeksisa itti agarsiisan -->
        <button class="btn" onclick="showAd()">Beeksisa Ilaali & Badhaasa Fudh</button>
    </div>

    <script>
        let adController = null;

        // 2. Adsgram qindeessuu (UnitID kee 44598 asitti galcheera)
        function initAdsgram() {
            try {
                if (window.Adsgram) {
                    adController = window.Adsgram.init({ blockId: "44598" }); 
                    document.getElementById("status-text").innerText = "Adsgram SDK qophaa'eera!";
                } else {
                    document.getElementById("status-text").innerText = "Adsgram SDK argamuu hin dandeenye.";
                }
            } catch (e) {
                console.log("Adsgram init error:", e);
                document.getElementById("status-text").innerText = "Adsgram fe'uu irratti dogoggorri uumame.";
            }
        }

        // Yeroo fuulli fe'amu Adsgram akka qophaa'u waamu
        window.addEventListener('load', () => {
            setTimeout(initAdsgram, 1000);
        });

        // 3. Button yeroo tuqamu beeksisa agarsiisuu
        async function showAd() {
            if (adController) {
                try {
                    document.getElementById("status-text").innerText = "Beeksisi dhihaachaa jira...";
                    const result = await adController.show();
                    
                    document.getElementById("status-text").innerText = "Galatoomi! Beeksisi milkaa'inaan ilaalamteera.";
                } catch (err) {
                    console.log("Ad error:", err);
                    document.getElementById("status-text").innerText = "Beeksisi hin fe'amne ykn cufameera.";
                }
            } else {
                alert("Adsgram SDK ammallee hin fe'amne. Intarneetii kee mirkaneessi!");
                initAdsgram();
            }
        }
    </script>
</body>
</html>
