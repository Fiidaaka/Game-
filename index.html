<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TON Connect SDK -->
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e1e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #2b2b2b;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .score {
            font-size: 40px;
            color: #4caf50;
            font-weight: bold;
            margin: 15px 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Connect Wallet Button -->
        <div id="ton-connect"></div>

        <h2>🎮 Tapha Mini App</h2>
        <p>Qabxii kee dabalachuuf button gadii cuqaasi!</p>

        <div class="score" id="score">0</div>

        <button class="btn" onclick="increaseScore()">Cuqaasi (+1)</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://fiidaaka.github.io/Game-/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        let count = 0;
        function increaseScore() {
            count++;
            document.getElementById("score").innerText = count;

            if (window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
