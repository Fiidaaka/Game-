<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #4ea8de;
            font-size: 24px;
        }
        p {
            color: #e0e1dd;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #3a86ff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2667cc;
        }
        .btn-ad {
            background-color: #ff006e;
        }
        .btn-ad:hover {
            background-color: #d9045b;
        }
    </style>
    <!-- Adsgram SDK Script -->
    <script src="https://sad.adsgram.ai/js/sad.js"></script>
</head>
<body>

    <div class="card">
        <h1>Fiidaaka Tapha Mini App</h1>
        <p id="status-text">Baga nagaan dhufthe! TronLink wallet kee wajjin walqabsiisi.</p>
        
        <!-- TronLink Connect Button -->
        <button class="btn" id="connectBtn" onclick="connectWallet()">Connect TronLink</button>
        
        <!-- Adsgram Reward Button -->
        <button class="btn btn-ad" onclick="showAd()">Beeksisa Ilaali (Earn Reward)</button>
    </div>

    <script>
        // --- TRONLINK WALLET LOGIC ---
        async function connectWallet() {
            if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                const address = window.tronWeb.defaultAddress.base58;
                document.getElementById('status-text').innerText = "Connected: " + address.substring(0, 6) + "..." + address.substring(address.length - 4);
                document.getElementById('connectBtn').innerText = "Connected";
            } else {
                alert("TronLink wallet hin argamne! Mee appii keessaa bani.");
            }
        }

        // --- ADSGRAM LOGIC ---
        // Kana keessatti "YOUR_BLOCK_ID_HERE" kan jedhu dhiiseefii Block ID kee sirrii galchita
        const adBlockId = "YOUR_BLOCK_ID_HERE"; 

        function showAd() {
            if (window.Adsgram) {
                window.Adsgram.init({ blockId: adBlockId }).show()
                    .then((result) => {
                        console.log("Ad watched successfully", result);
                        alert("Galatoomi! Beeksisa ilaaluun keetiif badhaasin kee siif darbeera.");
                    })
                    .catch((err) => {
                        console.error("Ad error", err);
                        alert("Beeksisichi hin xumuramne ykn rakkoon uumame.");
                    });
            } else {
                alert("Adsgram ammatti hin fe'amne, mee irra deebi'aa yaalaa.");
            }
        }
    </script>
</body>
</html>
