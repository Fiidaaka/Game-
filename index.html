<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <!-- Telegram Web App SDK, Adsgram SDK, & TON Connect UI -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }
        .header h1 {
            font-size: 16px;
            margin: 0;
            color: #38bdf8;
        }
        #wallet-container {
            transform: scale(0.85);
            transform-origin: right center;
        }
        .score-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #fbbf24;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin: 5px 0;
        }
        .tap-circle {
            background: linear-gradient(145deg, #10b981, #059669);
            color: white;
            border: none;
            width: 110px;
            height: 110px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px auto;
        }
        .tap-circle:active {
            transform: scale(0.93);
        }
        .menu-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 5px;
        }
        .btn {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.2);
        }
        .btn-ad { background-color: #0ea5e9; }
        .btn-ref { background-color: #8b5cf6; }
        .btn-withdraw { background-color: #f59e0b; }
        .btn:active {
            transform: scale(0.98);
        }
        #status-text {
            font-size: 11px;
            color: #94a3b8;
            height: 12px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Fiidaaka App</h1>
        <!-- Bakka Button Wallet Itti Muldhatu -->
        <div id="wallet-container"></div>
    </div>

    <div class="container" style="text-align: center;">
        <div class="score-card">⭐ <span id="score">1031</span></div>
        <button class="tap-circle" onclick="tapScore()">TAPHI!</button>
        <p id="status-text">Qophaa'aa Jira...</p>
    </div>

    <div class="menu-container">
        <button class="btn btn-ad" onclick="showAd()">Beeksisa Ilaali (+50)</button>
        <button class="btn btn-ref" onclick="shareRef()">Nama Afeeri (+100)</button>
        <button class="btn btn-withdraw" onclick="withdrawPoints()">Withdraw (Baasuuf)</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // TON Connect UI Qindeessuu
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://fiidaaka.github.io/tonconnect-manifest.json',
            buttonRootId: 'wallet-container'
        });

        let score = parseInt(localStorage.getItem('fiidaaka_score')) || 1031;
        document.getElementById("score").innerText = score;

        function updateScore(amount) {
            score += amount;
            document.getElementById("score").innerText = score;
            localStorage.setItem('fiidaaka_score', score);
        }

        let adController = null;

        function tapScore() {
            updateScore(1);
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        try {
            if (window.Adsgram) {
                adController = window.Adsgram.init({ blockId: "44598" });
                document.getElementById("status-text").innerText = "Taphachuuf qophoofteetta!";
            }
        } catch (e) {
            console.log("Error:", e);
        }

        async function showAd() {
            if (!adController) {
                alert("Adsgram ammallee hin fe'amne!");
                return;
            }

            try {
                document.getElementById("status-text").innerText = "Beeksisi dhihaachaa jira...";
                const result = await adController.show();
                updateScore(50);
                document.getElementById("status-text").innerText = "Galatoomi! Qabxii +50 argatteetta.";
            } catch (err) {
                console.log("Ad error:", err);
                document.getElementById("status-text").innerText = "Beeksisi cufameera ykn hin argamne.";
            }
        }

        function shareRef() {
            const botUrl = "https://t.me/FiidaakaGame_bot"; 
            const text = "Fiidaaka Tapha Mini App kanaan qabxii walitti qabadhu! Mee as tuqii seeni:";
            const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botUrl)}&text=${encodeURIComponent(text)}`;
            
            window.open(shareUrl, '_blank');
            updateScore(100);
            alert("Linkin afeerraa qoodameera! Qabxii +100 argatteetta.");
        }

        async function withdrawPoints() {
            if (score < 1000) {
                alert("Withdraw gochuuf qabxii 1,000 qabaachuu qabda! Qabxii kee: " + score);
                return;
            }

            const connectedWallet = tonConnectUI.wallet;
            if (!connectedWallet) {
                alert("Mee dura gubbaa irraa 'Connect Wallet' tuqiitii wallet kee waliin wal-qabsiisi!");
                tonConnectUI.openModal();
                return;
            }

            alert("Gaaffiin withdraw keetii wallet keetiin milkaa'inaan galateeffameera!");
        }
    </script>
</body>
</html>
