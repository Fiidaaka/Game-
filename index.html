
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 40px; 
            background: #0f172a; 
            color: #fff; 
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button { 
            background: #2563eb; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
        }
        button:hover { background: #1d4ed8; }
        #walletInfo { 
            margin-top: 20px; 
            word-break: break-all; 
            color: #38bdf8; 
            font-size: 14px;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fiidaaka Tapha Mini App</h1>
        <p>Baga nagaan dhufte! TronLink wallet kee wajjin walqabsiisi.</p>
        
        <!-- Connect Button (Comment keessaa baheera) -->
        <button id="connectBtn">Connect TronLink</button>
        
        <!-- Wallet Info Display (Comment keessaa baheera) -->
        <div id="walletInfo">Wallet hin qabamne</div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const walletInfo = document.getElementById('walletInfo');

        connectBtn.addEventListener('click', async () => {
            try {
                if (window.tronWeb && window.tronWeb.defaultAddress.base58) {
                    const userAddress = window.tronWeb.defaultAddress.base58;
                    walletInfo.innerHTML = `Connected Wallet:<br><b>${userAddress}</b>`;
                    connectBtn.innerText = "Connected";
                    connectBtn.style.background = "#16a34a";
                } else {
                    if (window.tronLink) {
                        const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                        if (res.code === 200) {
                            const userAddress = window.tronWeb.defaultAddress.base58;
                            walletInfo.innerHTML = `Connected Wallet:<br><b>${userAddress}</b>`;
                            connectBtn.innerText = "Connected";
                            connectBtn.style.background = "#16a34a";
                        } else {
                            walletInfo.innerText = "Wallet wajjin walqabachuun danda'amuu dhiise. Mee irra deebi'aa yaalaa.";
                        }
                    } else {
                        walletInfo.innerText = "Mee dura TronLink app banuu ykn install gochuu keessan mirkaneessaa!";
                    }
                }
            } catch (error) {
                console.error("Connection error:", error);
                walletInfo.innerText = "Rakkoon uumameera: " + error.message;
            }
        });
    </script>
</body>
</html>
