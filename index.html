
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <!-- Adsgram SDK Script -->
    <script src="https://sad.adsgram.ai/js/adsgram.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .tap-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
            transition: transform 0.1s ease;
        }
        .tap-btn:active {
            transform: scale(0.95);
        }
        .score {
            font-size: 28px;
            margin-top: 20px;
            color: #4ade80;
        }
    </style>
</head>
<body>

    <h1>Fiidaaka Tapha Mini App</h1>
    <p>Qabxii dabachuuf beeksisa ilaali!</p>

    <div class="score">Qabxii: <span id="scoreVal">0</span></div>
    <br>
    <button class="tap-btn" onclick="showRewardedAd()">Beeksisa Ilaali & Badhaasa Fudh</button>

    <script>
        // Adsgram Rewarded Controller initialization with UnitID: 44598
        const adController = window.Adsgram ? window.Adsgram.init({ blockId: "44598" }) : null;

        let score = 0;

        function showRewardedAd() {
            if (adController) {
                adController.show().then((result) => {
                    // Yeroo beeksisa xumure (rewarded success)
                    score += 10;
                    document.getElementById('scoreVal').innerText = score;
                    alert("Galatoomi! Badhaasni kee dabaleera.");
                }).catch((result) => {
                    // Yeroo beeksisa kuffise ykn cufame
                    alert("Beeksisi hin xumuramne: " + (result.description || "Gama biraatiin yaali"));
                });
            } else {
                alert("Adsgram SDK hin fe'amne!");
            }
        }
    </script>
</body>
</html>
