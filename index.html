
    
<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiidaaka Tapha Mini App</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1efefe;
            color: white;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #2b2b2b;
            padding: 25px;
            border-radius: 15px;
            max-width: 350px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #ton-connect {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .score {
            font-size: 40px;
            color: #4caf50;
            font-weight: bold;
            margin: 15px 0;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-boost {
            background-color: #f39c12;
            color: #fafafa;
        }
        .btn-withdraw {
            background-color: #28a745;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Connect Wallet Button -->
        <div id="ton-connect"></div>

        <h2>🎮 Tapha Mini App</h2>
        <p>Qabxii kee dabalachuuf button gadii cuqaasi!</p>

        <div class="score" id="score">203</div>

        <button class="btn" onclick="increaseScore()">Cuqaasi (+1)</button>
        <button class="btn btn-boost" onclick="buyBoost()">🚀 Boost Bitadhu (0.1 TON)</button>
        <button class="btn btn-withdraw" onclick="withdrawPoints()">📥 Qabxii Baafachuu (Withdraw)</button>
    </div>

    <script>
        window.Telegram.WebApp.ready();

        let currentScore = 203;

        function increaseScore() {
            currentScore += 1;
            document.getElementById('score').innerText = currentScore;
        }

        function buyBoost() {
            alert("Boost bituuf gara Telegram Wallettti geessaa jira...");
        }

        function withdrawPoints() {
            let minWithdraw = 100;
            if (currentScore < minWithdraw) {
                alert("Qabxii gahaa hin qabdu! Kaffaltii xiqqaa baafachuuf qabxii 100 ol qabaachuu qabda.");
                return;
            }
            alert("Gaaffiin withdraw kee galmaa'eera! Wallet keetti ergamaa jira...");
        }
    </script>
</body>
</html>
